<!doctype html>
<html lang="ko" data-orientation-lock="pending">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>메디컬 레코드 타이쿤 — 보건의료정보관리사 체험 게임</title>
    <meta name="description" content="병원 의무기록과 보건의료정보관리사의 업무를 체험하는 대한보건의료정보관리사협회 홍보용 게임" />
    <meta property="og:title" content="메디컬 레코드 타이쿤" />
    <meta property="og:description" content="보건의료정보관리사가 되어 병원 기록과 보건의료 데이터를 지켜보세요." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://khimapr8514-sketch.github.io/khima-game/" />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #10161f;
        height: 100%;
        min-height: 100dvh;
        overflow: hidden;
        touch-action: none;
      }
      #game {
        width: 100%;
        height: 100%;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: env(safe-area-inset-top) env(safe-area-inset-right)
          env(safe-area-inset-bottom) env(safe-area-inset-left);
        box-sizing: border-box;
      }
      #game canvas {
        display: block;
        max-width: 100%;
        max-height: 100%;
      }
      #rotate {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 10;
        background: #10161f;
        color: #ffffff;
        align-items: center;
        justify-content: center;
        text-align: center;
        font-family: sans-serif;
        font-size: 18px;
        line-height: 1.8;
      }
      #immersive-start {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 11;
        background: linear-gradient(180deg, #10161f, #1e3a5c);
        color: #ffffff;
        align-items: center;
        justify-content: center;
        text-align: center;
        font-family: sans-serif;
      }
      #immersive-start button {
        min-width: 260px;
        min-height: 64px;
        border: 0;
        border-radius: 10px;
        background: #2e86de;
        color: #ffffff;
        font-size: 20px;
        font-weight: 700;
        box-shadow: 0 8px 24px rgb(0 0 0 / 35%);
      }
      #immersive-start p {
        margin: 0 0 22px;
        color: #c8d8e8;
        font-size: 16px;
        line-height: 1.6;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      @media (orientation: portrait) and (max-width: 700px) {
        html[data-orientation-lock="pending"] #immersive-start {
          display: flex;
        }
        html[data-orientation-lock="unsupported"] #rotate {
          display: flex;
        }
      }
    </style>
    <script type="module" crossorigin src="./assets/index-DyT-vjRT.js"></script>
  </head>
  <body>
    <p id="game-help" class="sr-only">차트 목록은 숫자 1부터 6, 반송은 R, 코딩은 C, 감염병 신고 절차 지원은 I, 뒤로 가기는 Escape 키를 사용합니다. 민원 창에서는 1번이 발급, 2번이 거절입니다.</p>
    <div id="immersive-start">
      <div>
        <p>화면에 맞춰 크게 플레이할 수 있도록<br />전체화면과 가로 모드를 시작합니다.</p>
        <button id="immersive-start-button" type="button">⛶ 전체화면으로 시작</button>
      </div>
    </div>
    <div id="game"></div>
    <div id="rotate">📱<br />화면을 가로로 돌려서<br />플레이해 주세요!</div>
  </body>
</html>
