<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>메디컬 레코드 타이쿤 (프로토타입)</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #10161f;
        height: 100%;
        overflow: hidden;
      }
      #game {
        width: 100%;
        height: 100%;
      }
      #rotate {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 10;
        background: #10161f;
        color: #ffffff;
        align-items: center;
        justify-content: center;
        text-align: center;
        font-family: sans-serif;
        font-size: 18px;
        line-height: 1.8;
      }
      @media (orientation: portrait) and (max-width: 700px) {
        #rotate {
          display: flex;
        }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate">📱<br />화면을 가로로 돌려서<br />플레이해 주세요!</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
