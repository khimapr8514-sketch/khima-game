        height: 100%;

        position: fixed;

        padding: 0;

        white-space: nowrap;
        border: 0;
      }
      @media (orientation: portrait) and (max-width: 700px) {
        #rotate {
          display: flex;
        }
      }

    <p id="game-help" class="sr-only">차트 목록은 숫자 1부터 6, 반송은 R, 코딩은 C, 감염병 신고 절차 지원은 I, 뒤로 가기는 Escape 키를 사용합니다. 민원 창에서는 1번이 발급, 2번이 거절입니다.</p>
